name: Build WTA301 OpenWrt v9

on:
  push:
    branches: [wta301]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-yaml \
            swig m4

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          echo "Feeds updated"

      - name: Configure
        run: |
          # 清空 .config，写入最小配置
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_device_tplink_wta301=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          # 只编译内核，不编译其他包
          CONFIG_PACKAGE_kmod-loader-ramfs=y
          EOF
          
          # 完善配置
          make defconfig
          
          echo "=== .config 关键配置 ==="
          grep "CONFIG_TARGET" .config | head -10

      - name: Build toolchain
        run: |
          set -o pipefail
          echo "=== 编译工具链 ==="
          make -j$(nproc) toolchain/install V=s 2>&1 | tee build_toolchain.log | tail -50

      - name: Build kernel
        run: |
          set -o pipefail
          echo "=== 编译内核 ==="
          make -j$(nproc) target/linux/compile V=s 2>&1 | tee build_kernel.log | tail -100

      - name: Install image
        run: |
          set -o pipefail
          echo "=== 生成镜像 ==="
          make target/linux/install V=s 2>&1 | tee build_install.log | tail -50
          
          echo "=== 生成的文件 ==="
          ls -la bin/targets/qualcommax/ipq50xx/ 2>/dev/null || echo "目录不存在"

      - name: Upload initramfs image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wta301-initramfs-v9
          path: |
            bin/targets/qualcommax/ipq50xx/*wta301*initramfs*
          if-no-files-found: warn
