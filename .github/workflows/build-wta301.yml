name: Build WTA301 OpenWrt

on:
  push:
    branches: [wta301]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-yaml \
            swig

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for WTA301 (initramfs only)
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_device_tplink_wta301=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_DEVEL=y
          CONFIG_TOOLCHAINOPTS=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_openssl=y
          CONFIG_PACKAGE_wireless-regdb=y
          CONFIG_PACKAGE_kmod-ath11k=y
          CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122=y
          CONFIG_PACKAGE_kmod-dsa-rtl8365mb=y
          CONFIG_PACKAGE_usb=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_lsblk=y
          CONFIG_PACKAGE_btrfs-progs=y
          CONFIG_PACKAGE_kmod-fs-btrfs=y
          CONFIG_PACKAGE_autocore=y
          CONFIG_PACKAGE_autocore-arm64=y
          CONFIG_PACKAGE_automount=y
          CONFIG_PACKAGE_HTTPS=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          EOF
          make defconfig

      - name: Build
        run: |
          make -j$(nproc) V=s

      - name: Upload initramfs image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wta301-initramfs
          path: |
            bin/targets/qualcommax/ipq50xx/*initramfs*
            bin/targets/qualcommax/ipq50xx/*sysupgrade*
          if-no-files-found: error
