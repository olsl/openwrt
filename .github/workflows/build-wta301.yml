name: Build WTA301 OpenWrt v3

on:
  push:
    branches: [wta301]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-yaml \
            swig

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          echo "Feeds updated"

      - name: Configure for WTA301 (kernel only)
        run: |
          # 只编译内核和镜像，不编译任何包
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_tplink_wta301=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          # 禁用所有包
          CONFIG_PACKAGE_kmod-lib-crc16=n
          CONFIG_PACKAGE_libc=n
          CONFIG_PACKAGE_libgcc=n
          CONFIG_PACKAGE_libubox=n
          CONFIG_PACKAGE_libubus=n
          CONFIG_PACKAGE_libuclient=n
          CONFIG_PACKAGE_libnl=n
          CONFIG_PACKAGE_libopenssl=n
          CONFIG_PACKAGE_libstdcpp=n
          CONFIG_PACKAGE_linux-firmware=n
          CONFIG_PACKAGE_mtd=n
          CONFIG_PACKAGE_swconfig=n
          CONFIG_PACKAGE_uboot-envtools=n
          CONFIG_PACKAGE_ubus=n
          CONFIG_PACKAGE_ucode=n
          CONFIG_PACKAGE_uclient-fetch=n
          CONFIG_PACKAGE_uclient-ssl=n
          CONFIG_PACKAGE_uci=n
          CONFIG_PACKAGE_opkg=n
          # 禁用 Qt5
          CONFIG_PACKAGE_qt5base=n
          CONFIG_PACKAGE_qt5script=n
          CONFIG_PACKAGE_qt5tools=n
          EOF
          make defconfig
          # 再次禁用 Qt5
          sed -i 's/CONFIG_PACKAGE_qt5base=y/# CONFIG_PACKAGE_qt5base is not set/' .config
          make defconfig
          echo "=== .config 关键配置 ==="
          grep -E "CONFIG_TARGET|CONFIG_PACKAGE_kmod|CONFIG_PACKAGE_lib" .config | head -30

      - name: Build full
        run: |
          set -o pipefail
          # 完整编译
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo "=== 编译完成，查看生成的文件 ==="
          ls -la bin/targets/qualcommax/ipq50xx/ || echo "目录不存在！"

      - name: Upload initramfs image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wta301-initramfs-v3
          path: |
            bin/targets/qualcommax/ipq50xx/*initramfs*
          if-no-files-found: warn
