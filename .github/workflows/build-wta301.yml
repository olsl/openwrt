name: Build WTA301 OpenWrt v5

on:
  push:
    branches: [wta301]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-yaml \
            swig m4

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          echo "Feeds updated"

      - name: Configure for WTA301
        run: |
          # 使用默认配置，然后选择我们的设备
          make defconfig
          # 手动设置设备
          sed -i 's/CONFIG_TARGET_QUALCOMMAX_IPQ50XX_DEVICE_.*=y/# CONFIG_TARGET_QUALCOMMAX_IPQ50XX_DEVICE_ is not set/' .config
          echo "CONFIG_TARGET_QUALCOMMAX=y" >> .config
          echo "CONFIG_TARGET_QUALCOMMAX_IPQ50XX=y" >> .config
          echo "CONFIG_TARGET_QUALCOMMAX_IPQ50XX_DEVICE_tplink_wta301=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_INITRAMFS=y" >> .config
          echo "CONFIG_DEVEL=y" >> .config
          make defconfig
          echo "=== .config 关键配置 ==="
          grep -E "CONFIG_TARGET_QUALCOMMAX.*DEVICE" .config

      - name: Build
        run: |
          set -o pipefail
          echo "=== 开始编译 ==="
          make -j$(nproc) V=s 2>&1 | tee build.log | tail -200
          echo "=== 编译完成，查看生成的文件 ==="
          ls -la bin/targets/qualcommax/ipq50xx/

      - name: Upload initramfs image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wta301-initramfs-v5
          path: |
            bin/targets/qualcommax/ipq50xx/*wta301*initramfs*
          if-no-files-found: warn
