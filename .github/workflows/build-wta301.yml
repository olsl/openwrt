name: Build WTA301 OpenWrt v2

on:
  push:
    branches: [wta301]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-yaml \
            swig

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          # 先不安装任何额外包，只编译内核
          echo "Feeds updated"

      - name: Configure for WTA301 (minimal kernel only)
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_device_tplink_wta301=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          # 禁用所有额外包，只编译内核
          CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122=n
          CONFIG_PACKAGE_kmod-dsa-rtl8365mb=n
          CONFIG_PACKAGE_qt5base=n
          CONFIG_PACKAGE_qt5script=n
          CONFIG_PACKAGE_qt5tools=n
          EOF
          make defconfig
          # 再次禁用 Qt5
          sed -i 's/CONFIG_PACKAGE_qt5base=y/# CONFIG_PACKAGE_qt5base is not set/' .config
          make defconfig
          # 显示配置
          echo "=== .config 关键配置 ==="
          grep -E "CONFIG_TARGET|CONFIG_PACKAGE_ath11k|CONFIG_PACKAGE_kmod-dsa|CONFIG_PACKAGE_qt5" .config

      - name: Build (verbose output)
        run: |
          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log | tail -300

      - name: Upload initramfs image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wta301-initramfs-v2
          path: |
            bin/targets/qualcommax/ipq50xx/*initramfs*
          if-no-files-found: warn
