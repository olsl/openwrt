name: Build WTA301 OpenWrt v4

on:
  push:
    branches: [wta301]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-yaml \
            swig m4

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          echo "Feeds updated"

      - name: Configure for WTA301 (kernel only)
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_device_tplink_wta301=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          # 禁用 Qt5
          CONFIG_PACKAGE_qt5base=n
          CONFIG_PACKAGE_qt5script=n
          CONFIG_PACKAGE_qt5tools=n
          EOF
          make defconfig
          sed -i 's/CONFIG_PACKAGE_qt5base=y/# CONFIG_PACKAGE_qt5base is not set/' .config
          make defconfig
          echo "=== .config 关键配置 ==="
          grep -E "CONFIG_TARGET|CONFIG_PACKAGE_qt5" .config

      - name: Build toolchain
        run: |
          set -o pipefail
          echo "=== 编译工具链 ==="
          make -j$(nproc) toolchain/install V=s 2>&1 | tee build_toolchain.log | tail -100

      - name: Build kernel only
        run: |
          set -o pipefail
          echo "=== 编译内核 ==="
          make -j$(nproc) target/linux/compile V=s 2>&1 | tee build_kernel.log | tail -100
          echo "=== 安装内核 ==="
          make -j$(nproc) target/linux/install V=s 2>&1 | tee -a build_kernel.log | tail -100
          echo "=== 编译完成，查看生成的文件 ==="
          ls -la bin/targets/qualcommax/ipq50xx/

      - name: Upload initramfs image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wta301-initramfs-v4
          path: |
            bin/targets/qualcommax/ipq50xx/*initramfs*
          if-no-files-found: warn
