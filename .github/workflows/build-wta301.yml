name: Build WTA301 OpenWrt v7

on:
  push:
    branches: [wta301]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-yaml \
            swig m4

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          echo "Feeds updated"

      - name: Configure
        run: |
          # 第一步：先运行 make defconfig 生成基础配置
          make defconfig > /dev/null 2>&1
          
          # 第二步：设置 target 和 device
          sed -i 's/^CONFIG_TARGET_QUALCOMMAX.*/CONFIG_TARGET_qualcommax=y/' .config
          sed -i 's/^CONFIG_TARGET_QUALCOMMAX_IPQ50XX.*/CONFIG_TARGET_qualcommax_ipq50xx=y/' .config
          
          # 禁用所有设备，然后只启用我们的
          sed -i 's/^CONFIG_TARGET_QUALCOMMAX_IPQ50XX_DEVICE_.*/# CONFIG_TARGET_qualcommax_ipq50xx_device is not set/' .config
          echo 'CONFIG_TARGET_qualcommax_ipq50xx_device_tplink_wta301=y' >> .config
          
          # 启用 initramfs
          echo 'CONFIG_TARGET_ROOTFS_INITRAMFS=y' >> .config
          echo 'CONFIG_DEVEL=y' >> .config
          
          # 第三步：再次运行 make defconfig 完善配置
          make defconfig > /dev/null 2>&1
          
          echo "=== .config 关键配置 ==="
          grep -E "CONFIG_TARGET.*qualcommax.*DEVICE" .config || true
          grep "CONFIG_TARGET_ROOTFS_INITRAMFS" .config || true

      - name: Build
        run: |
          set -o pipefail
          echo "=== 开始编译 ==="
          make -j$(nproc) V=s 2>&1 | tee build.log | tail -200
          echo "=== 编译完成 ==="
          echo "生成的文件:"
          ls -la bin/targets/qualcommax/ipq50xx/ 2>/dev/null || echo "目录不存在"

      - name: Upload initramfs image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wta301-initramfs-v7
          path: |
            bin/targets/qualcommax/ipq50xx/*wta301*initramfs*
          if-no-files-found: warn
