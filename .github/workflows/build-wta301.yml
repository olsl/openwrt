name: Build WTA301 OpenWrt v10

on:
  push:
    branches: [wta301]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-yaml \
            swig m4

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          echo "Feeds updated"

      - name: Configure
        run: |
          # 清空 .config，写入 WTA301 配置
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_device_tplink_wta301=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          EOF
          
          # 完善配置
          make defconfig
          
          echo "=== .config 设备配置 ==="
          grep "CONFIG_TARGET.*DEVICE" .config || echo "没有找到设备配置！"
          echo ""
          echo "=== 确认目标平台 ==="
          grep "CONFIG_TARGET_qualcommax" .config | head -5

      - name: Build
        run: |
          set -o pipefail
          echo "=== 开始完整编译 ==="
          make -j$(nproc) V=s 2>&1 | tee build.log | tail -200
          echo "=== 编译完成 ==="
          echo "生成的文件:"
          ls -la bin/targets/qualcommax/ipq50xx/ 2>/dev/null || echo "目录不存在"

      - name: Upload initramfs image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wta301-initramfs-v10
          path: |
            bin/targets/qualcommax/ipq50xx/*wta301*initramfs*
          if-no-files-found: warn
