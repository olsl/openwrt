name: Build WTA301 OpenWrt

on:
  push:
    branches: [wta301]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget python3-yaml \
            swig

      - name: Feeds update
        run: |
          ./scripts/feeds update -a
          # 只安装必要的 feeds，不安装所有包
          ./scripts/feeds install ath11k-firmware-ipq5018-qcn6122
          ./scripts/feeds install kmod-dsa-rtl8365mb

      - name: Configure for WTA301 (initramfs only - minimal)
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_device_tplink_wta301=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_DEVEL=y
          CONFIG_PACKAGE_ath11k-firmware-ipq5018-qcn6122=y
          CONFIG_PACKAGE_kmod-dsa-rtl8365mb=y
          # 禁用有问题的包
          CONFIG_PACKAGE_qt5base=n
          CONFIG_PACKAGE_qt5script=n
          CONFIG_PACKAGE_qt5tools=n
          CONFIG_PACKAGE_qt5-x11=n
          CONFIG_PACKAGE_qt5-xml=n
          CONFIG_PACKAGE_qt5-xmlpatterns=n
          EOF
          make defconfig
          # 再次禁用 Qt5，防止 defconfig 重新启用
          sed -i 's/CONFIG_PACKAGE_qt5base=y/# CONFIG_PACKAGE_qt5base is not set/' .config
          make defconfig

      - name: Build
        run: |
          make -j$(nproc) V=s

      - name: Upload initramfs image
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-wta301-initramfs
          path: |
            bin/targets/qualcommax/ipq50xx/*initramfs*
            bin/targets/qualcommax/ipq50xx/*sysupgrade*
          if-no-files-found: error
